    <main class="login">
        <h2>Login</h2>
        <form id="loginForm" action="http://localhost:3000/login/logined" method="POST">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit" class="login-btn">Login</button>
            </div>
        </form>
    </main>
    
    <!-- end main -->
       <a id="back-to-top-btn" href="#">
           <span class="arrow-up">&#9650;</span>
       </a>
       
       <script>
        // Optional: JavaScript for client-side validation
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(event) {
            // Validate here if needed (e.g., check for empty fields)
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            if (usernameInput.value.trim() === '' || passwordInput.value.trim() === '') {
                alert('Please enter both username/email and password.');
                event.preventDefault(); // Prevent form submission
                return false;
            }
            // Add more validation as per your requirements 
        });
    </script>
       
       <script>
           window.onscroll = function() {
               scrollFunction()
           };

           function scrollFunction() {
               if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                   document.getElementById("back-to-top-btn").style.display = "block";
               } else {
                   document.getElementById("back-to-top-btn").style.display = "none";
               }
           }

           document.getElementById("back-to-top-btn").addEventListener("click", function(event) {
               event.preventDefault();
               document.body.scrollTop = 0; // For Safari
               document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
           });
       </script>
